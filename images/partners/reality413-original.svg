<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Кристалл оригинального портала «Реальность 4.13»</title>
  <desc id="description">Светящийся голубой кристалл с расходящимися лучами</desc>
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="46%" r="72%">
      <stop stop-color="#102b43"/>
      <stop offset=".58" stop-color="#0b2032"/>
      <stop offset="1" stop-color="#071522"/>
    </radialGradient>
    <radialGradient id="aura">
      <stop stop-color="#dff8ff" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#6fbcff" stop-opacity=".8"/>
      <stop offset=".58" stop-color="#347ce1" stop-opacity=".38"/>
      <stop offset="1" stop-color="#153a70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#70b8f7" stop-opacity="0"/>
      <stop offset=".42" stop-color="#a9dcff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#f4ffff" stop-opacity=".96"/>
      <stop offset=".58" stop-color="#a9dcff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#70b8f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="crystalLeft" x1="45" y1="30" x2="67" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3674f1"/>
      <stop offset=".45" stop-color="#83c7ff"/>
      <stop offset="1" stop-color="#2f74db"/>
    </linearGradient>
    <linearGradient id="crystalRight" x1="81" y1="33" x2="61" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dffaff"/>
      <stop offset=".45" stop-color="#f7ffff"/>
      <stop offset="1" stop-color="#82aaf1"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="12" fill="url(#backdrop)"/>
  <ellipse cx="64" cy="62" rx="62" ry="33" fill="url(#aura)" filter="url(#blur)"/>
  <path d="M0 57 45 50 64 57 83 50 128 57 128 69 83 73 64 66 45 73 0 69Z" fill="url(#ray)" opacity=".88"/>
  <path d="M58 0 52 45 61 63 55 87 62 128 70 128 74 88 66 64 76 43 69 0Z" fill="url(#aura)" opacity=".8"/>

  <g filter="url(#glow)" stroke="#d8f3ff" stroke-linejoin="round" stroke-width="1.1">
    <path d="M63 20 82 48 75 72 64 108 49 72 45 48Z" fill="#4f8ced"/>
    <path d="M63 20 63 58 45 48Z" fill="url(#crystalLeft)"/>
    <path d="M63 20 82 48 63 58Z" fill="url(#crystalRight)"/>
    <path d="M45 48 63 58 49 72Z" fill="#2f76df"/>
    <path d="M82 48 75 72 63 58Z" fill="#f0feff"/>
    <path d="M49 72 63 58 64 108Z" fill="#55a1f5"/>
    <path d="M75 72 64 108 63 58Z" fill="#cbdcff"/>
  </g>

  <circle cx="64" cy="59" r="8" fill="#fff" opacity=".9" filter="url(#glow)"/>
  <path d="M64 28 68 54 94 63 68 67 64 96 59 67 32 63 59 58Z" fill="#f6ffff" opacity=".68" filter="url(#glow)"/>
</svg>
